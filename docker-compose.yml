services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_OAUTH_BASE_URL: ${NEXT_PUBLIC_OAUTH_BASE_URL}
        NEXT_PUBLIC_OAUTH_LOGIN_ENDPOINT: ${NEXT_PUBLIC_OAUTH_LOGIN_ENDPOINT}
        NEXT_PUBLIC_OAUTH_SIGNUP_ENDPOINT: ${NEXT_PUBLIC_OAUTH_SIGNUP_ENDPOINT}
    container_name: the-auth-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - auth-net

networks:
  auth-net:
    external: true
    name: theauthservice_auth-net